  <script>
    (function() {
      const embeddedEl = document.getElementById('embedded-data');
      let embeddedData = {};
      try {
        embeddedData = embeddedEl && embeddedEl.textContent ? JSON.parse(embeddedEl.textContent) : {};
      } catch (error) {
        console.warn('Failed to parse embedded data:', error);
      }

      const titleEl = document.getElementById('project-title');
      const generatedAtEl = document.getElementById('generated-at');
      const activeBody = document.getElementById('active-body');
      const resolvedList = document.getElementById('resolved-list');
      const errorBanner = document.getElementById('error-banner');

      const tasksUrl = new URL('../tasks/latest.json', window.location.href);

      const statusLabels = { backlog: 'Ongoing', 'in-progress': 'In Progress', resolved: 'Resolved' };
      const statusClasses = { backlog: 'status-ongoing', 'in-progress': 'status-in-progress', resolved: 'status-resolved' };

      let tasksState = [];

      function taskScore(task) {
        const value = task && task.priority && task.priority.score != null ? Number(task.priority.score) : NaN;
        return Number.isFinite(value) ? value : -Infinity;
      }

      function taskRank(task) {
        const value = task && task.priority && task.priority.rank != null ? Number(task.priority.rank) : NaN;
        return Number.isFinite(value) ? value : Number.MAX_SAFE_INTEGER;
      }

      const formatScoreDisplay = task => {
        const value = taskScore(task);
        return Number.isFinite(value) ? value.toFixed(1) : '-';
      };

      const formatPriorityDetail = task => {
        const impact = task && task.priority && task.priority.impact != null ? task.priority.impact : '-';
        const confidence = task && task.priority && task.priority.confidence != null ? task.priority.confidence : '-';
        const effort = task && task.priority && task.priority.effort != null ? task.priority.effort : '-';
        return `Impact: ${impact} / Confidence: ${confidence} / Effort: ${effort}`;
      };

      const formatCluster = task => {
        if (task && task.cluster) {
          const label = task.cluster.label || task.cluster.key;
          const key = task.cluster.key ? `<code>${task.cluster.key}</code>` : '';
          if (label) {
            return `${label} ${key}`.trim();
          }
        }
        return '-';
      };

      const formatDependencies = deps => Array.isArray(deps) && deps.length ? deps.map(dep => `<code>${dep}</code>`).join(', ') : '-';

      const formatNotes = notes => Array.isArray(notes) && notes.length ? notes.map(note => `<div class="note">• ${note}</div>`).join('') : '';

      const buildSources = task => {
        const extractor = Array.isArray(task && task.links && task.links.extractor) ? task.links.extractor : [];
        const groups = Array.isArray(task && task.links && task.links.groups) ? task.links.groups : [];
        const scores = Array.isArray(task && task.links && task.links.scores) ? task.links.scores : [];
        const shepherd = task && task.links ? task.links.shepherd : null;
        const extractorHtml = extractor.length ? extractor.map(src => `Extractor: <code>${src.path}</code>${src.line ? ` (L${src.line})` : ''}`).join('<br/>') : 'Extractor: -';
        const groupsHtml = groups.length ? groups.map(src => `Groups: <code>${src.path}</code>${src.line ? ` (L${src.line})` : ''}`).join('<br/>') : 'Groups: -';
        const scoresHtml = scores.length ? scores.map(src => `Scores: <code>${src.path}</code>`).join('<br/>') : 'Scores: -';
        const shepherdHtml = shepherd && shepherd.path ? `Shepherd: <code>${shepherd.path}</code>` : 'Shepherd: -';
        return `
          <details class="source-details">
            <summary>ソース参照</summary>
            <div class="note">${extractorHtml}</div>
            <div class="note">${groupsHtml}</div>
            <div class="note">${scoresHtml}</div>
            <div class="note">${shepherdHtml}</div>
          </details>
        `;
      };

      const findTask = slug => tasksState.find(task => task.slug === slug);

      function renderActiveRow(task, fallbackIndex) {
        const displayRank = Number.isFinite(taskRank(task)) ? taskRank(task) : fallbackIndex + 1;
        const statusKey = task.status || 'backlog';
        const statusClass = statusClasses[statusKey] || 'status-ongoing';
        const statusLabel = statusLabels[statusKey] || statusKey;
        const summary = task.summary ? `<p>${task.summary}</p>` : '';
        const notes = formatNotes(task.notes);
        const markResolved = `<label class="progress-check"><input type="checkbox" data-action="resolve" data-slug="${task.slug}"> Mark as Resolved</label>`;
        return `
          <tr>
            <td>${displayRank}</td>
            <td>
              <strong><code>${task.slug}</code></strong>
              ${summary}
              ${notes}
              <div class="actions">
                ${markResolved}
              </div>
              ${buildSources(task)}
            </td>
            <td><span class="badge ${statusClass}">${statusLabel}</span></td>
            <td>
              <div>Score: <strong>${formatScoreDisplay(task)}</strong></div>
              <div class="priority-detail">${formatPriorityDetail(task)}</div>
            </td>
            <td>${formatCluster(task)}</td>
            <td>${formatDependencies(task.dependencies)}</td>
          </tr>
        `;
      }

      function renderResolvedPanel(task) {
        const summary = task.summary ? `<p>${task.summary}</p>` : '<p class="muted">Summary not provided.</p>';
        const notes = formatNotes(task.notes);
        const dependencies = formatDependencies(task.dependencies);
        return `
          <details>
            <summary>${task.title || task.slug}</summary>
            <div class="resolved-content">
              <div class="resolved-meta">
                <span class="badge ${statusClasses.resolved}">${statusLabels.resolved}</span>
                <span class="priority-score">Score: ${formatScoreDisplay(task)}</span>
                <span class="priority-detail">${formatPriorityDetail(task)}</span>
              </div>
              ${summary}
              ${notes}
              <div class="resolved-row"><strong>Cluster:</strong> ${formatCluster(task)}</div>
              <div class="resolved-row"><strong>Dependencies:</strong> ${dependencies}</div>
              ${buildSources(task)}
              <div class="actions">
                <button class="restore-button" data-action="restore" data-slug="${task.slug}">Return to Ongoing</button>
              </div>
            </div>
          </details>
        `;
      }

      function resolveTask(slug) {
        const task = findTask(slug);
        if (!task || task.status === 'resolved') return;
        task._lastActiveStatus = task.status || task._lastActiveStatus || 'backlog';
        task.status = 'resolved';
        render();
      }

      function restoreTask(slug) {
        const task = findTask(slug);
        if (!task) return;
        const targetStatus = task._lastActiveStatus || 'backlog';
        task.status = targetStatus;
        render();
      }

      function render() {
        const activeTasks = tasksState.filter(task => task.status !== 'resolved').sort((a, b) => {
          const scoreA = taskScore(a);
          const scoreB = taskScore(b);
          if (scoreA === scoreB) return (a.slug || '').localeCompare(b.slug || '');
          return scoreB - scoreA;
        });

        const resolvedTasks = tasksState.filter(task => task.status === 'resolved').sort((a, b) => {
          const rankA = taskRank(a);
          const rankB = taskRank(b);
          if (rankA === rankB) return (a.slug || '').localeCompare(b.slug || '');
          return rankA - rankB;
        });

        if (!activeTasks.length) {
          activeBody.innerHTML = '<tr><td colspan="6"><div class="empty-state">アクティブなタスクがありません。</div></td></tr>';
        } else {
          activeBody.innerHTML = activeTasks.map((task, index) => renderActiveRow(task, index)).join('');
        }

        if (!resolvedTasks.length) {
          resolvedList.innerHTML = '<div class="empty-state">解決済みタスクはまだありません。</div>';
        } else {
          resolvedList.innerHTML = resolvedTasks.map(renderResolvedPanel).join('');
        }

        document.querySelectorAll('[data-action="resolve"]').forEach(input => {
          input.addEventListener('change', event => {
            const slug = event.currentTarget.dataset.slug;
            if (event.currentTarget.checked) {
              resolveTask(slug);
            }
          });
        });

        document.querySelectorAll('[data-action="restore"]').forEach(button => {
          button.addEventListener('click', event => {
            event.preventDefault();
            const slug = event.currentTarget.dataset.slug;
            restoreTask(slug);
          });
        });
      }

      function normalizeDataset(dataset) {
        if (!dataset || typeof dataset !== 'object') {
          return { project: '-', generated_at: '-', tasks: [] };
        }
        const normalizedTasks = Array.isArray(dataset.tasks)
          ? dataset.tasks.reduce((acc, rawTask) => {
              if (!rawTask || typeof rawTask !== 'object' || !rawTask.slug) {
                return acc;
              }
              const status = typeof rawTask.status === 'string' ? rawTask.status : 'backlog';
              const lastActive = typeof rawTask._lastActiveStatus === 'string' && rawTask._lastActiveStatus
                ? rawTask._lastActiveStatus
                : (status === 'resolved' ? 'backlog' : status);
              acc.push({
                slug: rawTask.slug,
                title: rawTask.title || '',
                summary: rawTask.summary || '',
                status,
                priority: rawTask.priority && typeof rawTask.priority === 'object' ? rawTask.priority : {},
                cluster: rawTask.cluster && typeof rawTask.cluster === 'object' ? rawTask.cluster : {},
                dependencies: Array.isArray(rawTask.dependencies) ? rawTask.dependencies : [],
                notes: Array.isArray(rawTask.notes) ? rawTask.notes : [],
                links: rawTask.links && typeof rawTask.links === 'object' ? rawTask.links : {},
                _lastActiveStatus: lastActive
              });
              return acc;
            }, [])
          : [];
        return {
          project: dataset.project || '-',
          generated_at: dataset.generated_at || '-',
          tasks: normalizedTasks
        };
      }

      function applyDataset(dataset) {
        const normalized = normalizeDataset(dataset);
        titleEl.textContent = `${normalized.project} — Prioritized Tasks`;
        generatedAtEl.textContent = normalized.generated_at;
        tasksState = normalized.tasks.map(task => ({ ...task }));
        render();
      }

      async function loadData() {
        let dataset = embeddedData;
        let usedFallback = true;
        try {
          const response = await fetch(tasksUrl.href, { cache: 'no-store' });
          if (response.ok) {
            dataset = await response.json();
            usedFallback = false;
          } else {
            console.warn('Failed to fetch latest.json:', response.status, response.statusText);
          }
        } catch (error) {
          console.warn('Failed to fetch latest.json:', error);
        }

        if (usedFallback) {
          errorBanner.textContent = '最新のタスクJSONを取得できませんでした。埋め込みデータを表示しています。';
          errorBanner.style.display = 'block';
        } else {
          errorBanner.style.display = 'none';
        }

        applyDataset(dataset);
      }

      loadData();
    })();
  </script>
